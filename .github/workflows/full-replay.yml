name: full-replay

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 tools/check_release_metadata.py \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY"
      - name: Pin Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: Record toolchain
        run: |
          c++ --version
          rustc --version
          cargo --version
          python3 --version
      - name: Build DRAT-trim
        run: |
          git clone https://github.com/marijnheule/drat-trim.git \
            build/proof-tools/drat-trim
          git -C build/proof-tools/drat-trim checkout \
            2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          make -C build/proof-tools/drat-trim
      - name: Build rate
        run: |
          git clone https://github.com/krobelus/rate.git \
            build/proof-tools/rate
          git -C build/proof-tools/rate checkout \
            93bf524435455ddc0b370669c17b1eb8741a026c
          cargo build --release \
            --locked \
            --manifest-path build/proof-tools/rate/Cargo.toml
      - name: Replay complete certificate
        run: |
          python3 tools/verify_p29_certificate.py \
            --certificate-dir results/p29-level15-certificate-v1 \
            --drat-trim build/proof-tools/drat-trim/drat-trim \
            --rate build/proof-tools/rate/target/release/rate \
            --full-replay \
            --jobs 4

  release:
    needs: replay
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: Install Tectonic 0.17.0
        run: |
          mkdir -p build/tectonic
          curl -fL --retry 4 --retry-all-errors \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz \
            -o build/tectonic/tectonic.tar.gz
          echo \
            "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  build/tectonic/tectonic.tar.gz" \
            | shasum -a 256 -c -
          tar -xzf build/tectonic/tectonic.tar.gz -C build/tectonic
      - name: Build and test exact solvers
        run: |
          make terminal-solver rust-verifier smoke
          build/verify_p29_level15 --self-test
      - name: Build release assets
        run: |
          TECTONIC=build/tectonic/tectonic \
            make release-assets \
              VERSION_TAG="$GITHUB_REF_NAME" \
              REPOSITORY="$GITHUB_REPOSITORY"
      - name: Inspect and reproduce release PDF
        run: |
          test -s \
            dist/release/lonely-runner-15-prime-29-paper.pdf
          test "$(
            head -c 5 \
              dist/release/lonely-runner-15-prime-29-paper.pdf
          )" = "%PDF-"
          ! grep -E \
            "Overfull|Underfull|LaTeX Warning|Undefined" \
            build/paper/main.log
          cp dist/release/lonely-runner-15-prime-29-paper.pdf \
            build/release-pdf-first.pdf
          TECTONIC=build/tectonic/tectonic make paper-build
          cmp build/release-pdf-first.pdf build/paper/main.pdf
      - name: Check deterministic source bundle
        run: |
          cp dist/paper/lonely-runner-15-prime-29-source.tar.gz \
            build/source-first.tar.gz
          make paper-bundle
          cmp build/source-first.tar.gz \
            dist/paper/lonely-runner-15-prime-29-source.tar.gz
      - name: Compile from release source bundle
        run: |
          mkdir -p build/source-replay build/source-replay-output
          tar -xzf \
            dist/release/lonely-runner-15-prime-29-source.tar.gz \
            -C build/source-replay
          cd build/source-replay
          SOURCE_DATE_EPOCH=1788739200 \
            ../tectonic/tectonic -X compile paper/main.tex \
              --outdir ../source-replay-output --keep-logs
          cmp ../source-replay-output/main.pdf \
            ../../dist/release/lonely-runner-15-prime-29-paper.pdf
      - name: Check deterministic certificate bundle
        run: |
          cp \
            dist/certificate/lonely-runner-15-prime-29-certificate-v1.tar.gz \
            build/certificate-first.tar.gz
          make certificate-bundle
          cmp build/certificate-first.tar.gz \
            dist/certificate/lonely-runner-15-prime-29-certificate-v1.tar.gz
      - name: Replay extracted certificate
        run: |
          mkdir -p build/certificate-replay
          tar -xzf \
            dist/release/lonely-runner-15-prime-29-certificate-v1.tar.gz \
            -C build/certificate-replay
          cd build/certificate-replay/lonely-runner-15-prime-29-certificate-v1
          python3 tools/verify_p29_certificate.py \
            --certificate-dir results/p29-level15-certificate-v1
      - name: Check release checksums and formatting
        run: |
          make release-checksums
          make release-verify
          git diff --check
      - name: Upload release workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lonely-runner-15-prime-29-tagged-release-assets
          path: |
            dist/release/lonely-runner-15-prime-29-paper.pdf
            dist/release/lonely-runner-15-prime-29-source.tar.gz
            dist/release/lonely-runner-15-prime-29-certificate-v1.tar.gz
            dist/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Verify live release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          live_commit="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" \
              --jq .sha
          )"
          test "$live_commit" = "$(git rev-parse HEAD)"
      - name: Stage draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft \
              2>/dev/null || true
          )"
          if test "$existing" = "false"; then
            echo "a published release already exists" >&2
            exit 1
          fi
          if test "$existing" = "true"; then
            gh release delete "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "Prime-29 Gate for Fifteen Lonely Runners" \
            --notes-file RELEASE_NOTES.md \
            dist/release/lonely-runner-15-prime-29-paper.pdf \
            dist/release/lonely-runner-15-prime-29-source.tar.gz \
            dist/release/lonely-runner-15-prime-29-certificate-v1.tar.gz \
            dist/release/SHA256SUMS
      - name: Verify staged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft
          )" = "true"
          mkdir -p build/release-download
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir build/release-download
          cmp \
            dist/release/lonely-runner-15-prime-29-paper.pdf \
            build/release-download/lonely-runner-15-prime-29-paper.pdf
          cmp \
            dist/release/lonely-runner-15-prime-29-source.tar.gz \
            build/release-download/lonely-runner-15-prime-29-source.tar.gz
          cmp \
            dist/release/lonely-runner-15-prime-29-certificate-v1.tar.gz \
            build/release-download/lonely-runner-15-prime-29-certificate-v1.tar.gz
          cmp \
            dist/release/SHA256SUMS \
            build/release-download/SHA256SUMS
