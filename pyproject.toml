[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lonely-runner-15"
version = "0.1.2"
description = "Exact certificate and verification software for the prime-29 gate in the fifteen-runner Lonely Runner Problem"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Ruturaj R Raval"}
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
