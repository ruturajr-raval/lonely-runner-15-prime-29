name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.7"
      - name: Pin Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: Build exact solvers
        run: make terminal-solver rust-verifier
      - name: Run tests
        run: make test
      - name: Validate release metadata
        run: make release-metadata
      - name: Verify selected certificate
        run: make certificate-fast
      - name: Run smoke calculation
        run: make smoke
      - name: Check Rust CRT implementation
        run: build/verify_p29_level15 --self-test
      - name: Check repository formatting
        run: git diff --check

  paper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tectonic 0.17.0
        run: |
          mkdir -p build/tectonic
          curl -fL --retry 4 --retry-all-errors \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz \
            -o build/tectonic/tectonic.tar.gz
          echo \
            "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  build/tectonic/tectonic.tar.gz" \
            | shasum -a 256 -c -
          tar -xzf build/tectonic/tectonic.tar.gz -C build/tectonic
      - name: Build release assets
        run: TECTONIC=build/tectonic/tectonic make release-assets
      - name: Inspect and reproduce release PDF
        run: |
          test -s \
            dist/release/lonely-runner-15-prime-29-paper.pdf
          test "$(
            head -c 5 \
              dist/release/lonely-runner-15-prime-29-paper.pdf
          )" = "%PDF-"
          ! grep -E \
            "Overfull|Underfull|LaTeX Warning|Undefined" \
            build/paper/main.log
          cp dist/release/lonely-runner-15-prime-29-paper.pdf \
            build/release-pdf-first.pdf
          TECTONIC=build/tectonic/tectonic make paper-build
          cmp build/release-pdf-first.pdf build/paper/main.pdf
      - name: Check deterministic source bundle
        run: |
          cp dist/paper/lonely-runner-15-prime-29-source.tar.gz \
            build/source-first.tar.gz
          make paper-bundle
          cmp build/source-first.tar.gz \
            dist/paper/lonely-runner-15-prime-29-source.tar.gz
      - name: Check deterministic certificate bundle
        run: |
          cp \
            dist/certificate/lonely-runner-15-prime-29-certificate-v1.tar.gz \
            build/certificate-first.tar.gz
          make certificate-bundle
          cmp build/certificate-first.tar.gz \
            dist/certificate/lonely-runner-15-prime-29-certificate-v1.tar.gz
      - name: Replay extracted certificate
        run: |
          mkdir -p build/certificate-replay
          tar -xzf \
            dist/certificate/lonely-runner-15-prime-29-certificate-v1.tar.gz \
            -C build/certificate-replay
          cd build/certificate-replay/lonely-runner-15-prime-29-certificate-v1
          python3 tools/verify_p29_certificate.py \
            --certificate-dir results/p29-level15-certificate-v1
      - name: Check release checksums
        run: make release-checksums
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lonely-runner-15-prime-29-release-assets
          path: |
            dist/release/lonely-runner-15-prime-29-paper.pdf
            dist/release/lonely-runner-15-prime-29-source.tar.gz
            dist/release/lonely-runner-15-prime-29-certificate-v1.tar.gz
            dist/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
