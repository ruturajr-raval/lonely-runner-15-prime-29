current_supported_claim:
  statement: >-
    For fourteen moving runners at prime 29, the unique level-one improper
    orbit is represented by (1,2,...,14). Every improper level-15 lift belongs
    to one of two exhaustive symmetry branches. Two independently written
    exact solvers exclude all thirteen coprime coordinate-zero cases, and a
    checked DRAT proof excludes the noncoprime branch. Consequently,
    J(14,29) is empty.
